strategy: avellaneda_mm
strategy_params:
  gamma: 0.05
  k: 23.0
  base_size: 0.12
  max_inventory: 0.60
  min_spread_bps: 20.0
  max_spread_bps: 28.0
  vol_window: 48
  order_type: Alo
  ioc_cross_bps: 0.0
  close_only_at_profit: true

instrument: SOL-USD-PERP
venue: paradex
mainnet: true
tick_interval: 2.0
dry_run: false

data_dir: data/paradex-sol-profit-tuned-maker-only-safe
log_level: INFO

max_position_qty: 0.60
max_notional_usd: 600
max_order_size: 0.12
max_daily_drawdown_pct: 1.0
max_leverage: 1.5
tvl: 500

builder:
  builder_address: ""
  fee_rate_tenths_bps: 0

execution:
  paradex_min_notional_mode: strict
  paradex_passive_min_notional_mode: floor
  paradex_reduce_only_min_notional_mode: auto_bump
  paradex_auto_bump_buffer_pct: 0.0
  maker_refresh_interval_s: 3.0
  close_positions_on_shutdown: false
  inventory_alert_qty: 0.50

risk_gate:
  cooldown_trigger_losses: 4
  cooldown_duration_ms: 300000
  cooldown_drawdown_pct: 50.0
  cooldown_close_losses: 2
